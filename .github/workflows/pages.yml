name: Deploy Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Substituir URL do backend no HTML
        # Injeta a URL do ngrok no lugar do placeholder.
        # BACKEND_URL deve estar configurado em:
        # Settings → Secrets and variables → Actions → Repository secrets
        run: |
          sed -i "s|BACKEND_URL_PLACEHOLDER|${{ secrets.BACKEND_URL }}|g" public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload da pasta public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
